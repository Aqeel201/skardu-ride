name: Build SkarduRide Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /g' android/app/src/main/AndroidManifest.xml

      - name: Build Signed Release Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SkarduRide-v3.0.apk

      - name: Upload SkarduRide Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkarduRide-Android-APK
          path: SkarduRide-v3.0.apk
          retention-days: 30

      - name: Publish Public GitHub Release with Direct APK Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: SkarduRide v3.0.0 (Android APK)
          body: "Official Installable Android APK for SkarduRide (Gilgit-Baltistan Ride-Hailing & 4x4 Tourism App)."
          files: SkarduRide-v3.0.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
