services:
  - type: web
    name: skardu-ride-mern-backend
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: node backend/server.js
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
